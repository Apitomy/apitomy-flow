name: NPM Publish Workflow
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 1.0.0)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy' && !github.event.release.prerelease
    steps:
      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "release-version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release-version=${{ inputs.release-version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ steps.version.outputs.release-version }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Flow UI version ${{ steps.version.outputs.release-version }} to npm"
          echo "Publishing from tag: v${{ steps.version.outputs.release-version }}"


      - name: Build Project
        run: |
          npm ci
          npm run lint
          npm run build
        working-directory: ui


      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: ui

      # Slack: success to the general channel, failure to the important one.
      - name: Notify
        if: ${{ !cancelled() }}
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ job.status == 'success' && 'general' || 'important' }}
          text: "${{ job.status == 'success' && format(':package: {0}: {1} published {2}', github.repository, github.workflow, steps.version.outputs.release-version) || format(':x: {0}: {1} failed for {2}', github.repository, github.workflow, steps.version.outputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ job.status != 'success' && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
