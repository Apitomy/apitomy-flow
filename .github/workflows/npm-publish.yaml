name: NPM Publish Workflow
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 1.0.0)'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy' && !github.event.release.prerelease
    steps:
      - name: Resolve release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "release-version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release-version=${{ inputs.release-version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ steps.version.outputs.release-version }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Flow UI version ${{ steps.version.outputs.release-version }} to npm"
          echo "Publishing from tag: v${{ steps.version.outputs.release-version }}"


      - name: Build Project
        run: |
          npm ci
          npm run lint
          npm run build
        working-directory: ui


      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: ui


      - name: Slack Notification (Always)
        if: always()
        run: |
          MESSAGE="NPM publish for version ${{ steps.version.outputs.release-version }} completed with status: ${{ job.status }}"
          REPO="${{ github.repository }}"
          LINK="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          PAYLOAD="{\"workflow\": \"${{ github.workflow }}\", \"status\": \"${{ job.status }}\", \"message\": \"$MESSAGE\", \"link\": \"$LINK\", \"repository\": \"$REPO\"}"
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}

      - name: Slack Notification (Error)
        if: failure()
        run: |
          MESSAGE="NPM publish for version ${{ steps.version.outputs.release-version }} FAILED!"
          REPO="${{ github.repository }}"
          LINK="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          PAYLOAD="{\"workflow\": \"${{ github.workflow }}\", \"status\": \"${{ job.status }}\", \"message\": \"$MESSAGE\", \"link\": \"$LINK\", \"repository\": \"$REPO\"}"
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" ${{ secrets.SLACK_ERROR_WEBHOOK }}
