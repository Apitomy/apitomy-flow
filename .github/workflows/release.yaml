name: Release Workflow
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    outputs:
      release-version: ${{ steps.versions.outputs.release-version }}
      snapshot-version: ${{ steps.versions.outputs.snapshot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      # Pre-fetch the Maven distribution used by the wrapper, retrying transient download failures
      # (e.g. Maven Central hiccups) with exponential backoff: 5s, 10s, 20s, 40s between attempts.
      - name: Download Maven (with retry)
        uses: Apitomy/apitomy-github-actions/retry@e10e64b8a9ca86982f45a1ea512847219ae2605e # v1.0.1
        with:
          command: ./mvnw -B --version
          working-directory: engine
          max-attempts: 5
          initial-delay: 5

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"


      - name: Compute Release and Snapshot Versions
        id: versions
        run: |
          CURRENT_VERSION=$(cd engine && ./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          SNAPSHOT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "snapshot-version=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $RELEASE_VERSION"
          echo "Next snapshot version: $SNAPSHOT_VERSION"


      - name: Set release version (engine)
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.versions.outputs.release-version }} -DgenerateBackupPoms=false
        working-directory: engine

      - name: Set release version (UI)
        run: npm version ${{ steps.versions.outputs.release-version }} --no-git-tag-version
        working-directory: ui


      - name: Build engine
        run: ./mvnw -B clean install
        working-directory: engine

      - name: Build UI
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        working-directory: ui


      - name: Commit release version
        run: |
          git add -A
          git commit -m "Automated version update: ${{ steps.versions.outputs.release-version }}"
          git push


      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.versions.outputs.release-version }}" \
            --target "${{ inputs.branch }}" \
            --title "${{ steps.versions.outputs.release-version }}" \
            --generate-notes \
            --prerelease=${{ contains(steps.versions.outputs.release-version, 'RC') || contains(steps.versions.outputs.release-version, 'alpha') || contains(steps.versions.outputs.release-version, 'beta') }} \
            engine/target/apitomy-flow-engine-${{ steps.versions.outputs.release-version }}.jar
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}


  maven-publish:
    needs: release
    uses: ./.github/workflows/maven-publish.yaml
    with:
      release-version: ${{ needs.release.outputs.release-version }}
      quiet: true
    secrets: inherit


  finalize:
    needs: [release, maven-publish]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      # Pre-fetch the Maven distribution used by the wrapper, retrying transient download failures
      # (e.g. Maven Central hiccups) with exponential backoff: 5s, 10s, 20s, 40s between attempts.
      - name: Download Maven (with retry)
        uses: Apitomy/apitomy-github-actions/retry@e10e64b8a9ca86982f45a1ea512847219ae2605e # v1.0.1
        with:
          command: ./mvnw -B --version
          working-directory: engine
          max-attempts: 5
          initial-delay: 5

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git pull


      - name: Set next SNAPSHOT version (engine)
        run: ./mvnw -B versions:set -DnewVersion=${{ needs.release.outputs.snapshot-version }} -DgenerateBackupPoms=false
        working-directory: engine

      - name: Set next SNAPSHOT version (UI)
        run: npm version ${{ needs.release.outputs.snapshot-version }} --no-git-tag-version
        working-directory: ui


      - name: Commit and push next development version
        run: |
          git add -A
          git commit -m "Automated version update: ${{ needs.release.outputs.snapshot-version }}"
          git push


      - name: Check Publishing Results
        run: |
          echo "Release workflow completed"
          echo "Maven publish status: ${{ needs.maven-publish.result }}"
          if [[ "${{ needs.maven-publish.result }}" != "success" ]]; then
            echo "WARNING: Maven publish failed. You can retry it manually:"
            echo "  https://github.com/${{ github.repository }}/actions/workflows/maven-publish.yaml"
          fi


  # Slack: the outcome of the whole release, publishes included. Success to
  # the general channel, a failure to the important one, mentioning whoever
  # ran it. A failed publish can be re-run on its own from its workflow.
  notify:
    name: Notify
    needs: [release, maven-publish, finalize]
    if: ${{ !cancelled() && github.repository_owner == 'Apitomy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'important' || 'general' }}
          text: "${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && format(':x: {0}: release {1} failed (release {2}, maven-publish {3}, finalize {4})', github.repository, needs.release.outputs.release-version, needs.release.result, needs.maven-publish.result, needs.finalize.result) || format(':rocket: {0} {1} released', github.repository, needs.release.outputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
