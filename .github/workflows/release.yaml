name: Release Workflow
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'main'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    outputs:
      release-version: ${{ steps.versions.outputs.release-version }}
      snapshot-version: ${{ steps.versions.outputs.snapshot-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"


      - name: Compute Release and Snapshot Versions
        id: versions
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f engine/pom.xml)
          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          SNAPSHOT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "snapshot-version=$SNAPSHOT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $RELEASE_VERSION"
          echo "Next snapshot version: $SNAPSHOT_VERSION"


      - name: Set release version (engine)
        run: mvn versions:set -DnewVersion=${{ steps.versions.outputs.release-version }} -DgenerateBackupPoms=false
        working-directory: engine

      - name: Set release version (UI)
        run: npm version ${{ steps.versions.outputs.release-version }} --no-git-tag-version
        working-directory: ui


      - name: Build engine
        run: mvn clean install
        working-directory: engine

      - name: Build UI
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        working-directory: ui


      - name: Commit release version
        run: |
          git add -A
          git commit -m "Automated version update: ${{ steps.versions.outputs.release-version }}"
          git push


      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.versions.outputs.release-version }}" \
            --target "${{ inputs.branch }}" \
            --title "${{ steps.versions.outputs.release-version }}" \
            --generate-notes \
            --prerelease=${{ contains(steps.versions.outputs.release-version, 'RC') || contains(steps.versions.outputs.release-version, 'alpha') || contains(steps.versions.outputs.release-version, 'beta') }} \
            engine/target/apitomy-flow-engine-${{ steps.versions.outputs.release-version }}.jar
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}


  maven-publish:
    needs: release
    uses: ./.github/workflows/maven-publish.yaml
    with:
      release-version: ${{ needs.release.outputs.release-version }}
    secrets: inherit


  npm-publish:
    needs: release
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/npm-publish.yaml
    with:
      release-version: ${{ needs.release.outputs.release-version }}
    secrets: inherit


  finalize:
    needs: [release, maven-publish, npm-publish]
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"
          git pull


      - name: Set next SNAPSHOT version (engine)
        run: mvn versions:set -DnewVersion=${{ needs.release.outputs.snapshot-version }} -DgenerateBackupPoms=false
        working-directory: engine

      - name: Set next SNAPSHOT version (UI)
        run: npm version ${{ needs.release.outputs.snapshot-version }} --no-git-tag-version
        working-directory: ui


      - name: Commit and push next development version
        run: |
          git add -A
          git commit -m "Automated version update: ${{ needs.release.outputs.snapshot-version }}"
          git push


      - name: Check Publishing Results
        run: |
          echo "Release workflow completed"
          echo "Maven publish status: ${{ needs.maven-publish.result }}"
          echo "NPM publish status: ${{ needs.npm-publish.result }}"
          if [[ "${{ needs.maven-publish.result }}" != "success" ]]; then
            echo "WARNING: Maven publish failed. You can retry it manually:"
            echo "  https://github.com/${{ github.repository }}/actions/workflows/maven-publish.yaml"
          fi
          if [[ "${{ needs.npm-publish.result }}" != "success" ]]; then
            echo "WARNING: NPM publish failed. You can retry it manually:"
            echo "  https://github.com/${{ github.repository }}/actions/workflows/npm-publish.yaml"
          fi


      - name: Slack Notification (Always)
        if: always()
        run: |
          MAVEN_STATUS="${{ needs.maven-publish.result }}"
          NPM_STATUS="${{ needs.npm-publish.result }}"
          if [[ "$MAVEN_STATUS" != "success" || "$NPM_STATUS" != "success" ]]; then
            MESSAGE="Release ${{ needs.release.outputs.release-version }} completed with warnings. Maven: $MAVEN_STATUS, NPM: $NPM_STATUS. Manual retry may be needed."
          else
            MESSAGE="Release ${{ needs.release.outputs.release-version }} completed successfully"
          fi
          REPO="${{ github.repository }}"
          LINK="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          PAYLOAD="{\"workflow\": \"${{ github.workflow }}\", \"status\": \"${{ job.status }}\", \"message\": \"$MESSAGE\", \"link\": \"$LINK\", \"repository\": \"$REPO\"}"
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" ${{ secrets.SLACK_NOTIFICATION_WEBHOOK }}

      - name: Slack Notification (Publishing Failures)
        if: needs.maven-publish.result != 'success' || needs.npm-publish.result != 'success'
        run: |
          MESSAGE="Release ${{ needs.release.outputs.release-version }}: Publishing failures — Maven: ${{ needs.maven-publish.result }}, NPM: ${{ needs.npm-publish.result }}. Retry at https://github.com/${{ github.repository }}/actions"
          REPO="${{ github.repository }}"
          LINK="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          PAYLOAD="{\"workflow\": \"${{ github.workflow }}\", \"status\": \"warning\", \"message\": \"$MESSAGE\", \"link\": \"$LINK\", \"repository\": \"$REPO\"}"
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" ${{ secrets.SLACK_ERROR_WEBHOOK }}
