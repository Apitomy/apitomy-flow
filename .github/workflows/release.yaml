name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Apitomy Flow
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Set up Java 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: oracle
          java-version: 25
      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Configure Git
        run: |
          git config user.name "apitomy-ci"
          git config user.email "apitomy.ci@gmail.com"

      - name: Determine release version
        id: version
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          RELEASE=${CURRENT%-SNAPSHOT}
          echo "release-version=$RELEASE" >> "$GITHUB_OUTPUT"
        working-directory: engine

      - name: Set release version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.release-version }} -DgenerateBackupPoms=false
        working-directory: engine
      - name: Update UI version
        run: npm version ${{ steps.version.outputs.release-version }} --no-git-tag-version
        working-directory: ui

      - name: Build engine
        run: mvn clean install
        working-directory: engine
      - name: Build UI
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        working-directory: ui

      - name: Commit release version
        run: |
          git add -A
          git commit -m "Release ${{ steps.version.outputs.release-version }}"

      - name: Tag release
        run: git tag v${{ steps.version.outputs.release-version }}

      - name: Push release
        run: git push && git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.release-version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.release-version, 'RC') || contains(steps.version.outputs.release-version, 'alpha') || contains(steps.version.outputs.release-version, 'beta') }}
          files: |
            engine/target/apitomy-flow-engine-${{ steps.version.outputs.release-version }}.jar

      - name: Compute next SNAPSHOT version
        id: next
        run: |
          RELEASE=${{ steps.version.outputs.release-version }}
          IFS='.' read -ra PARTS <<< "$RELEASE"
          PATCH=$((PARTS[2] + 1))
          NEXT="${PARTS[0]}.${PARTS[1]}.$PATCH-SNAPSHOT"
          echo "next-version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set next SNAPSHOT version
        run: mvn versions:set -DnewVersion=${{ steps.next.outputs.next-version }} -DgenerateBackupPoms=false
        working-directory: engine
      - name: Update UI to next SNAPSHOT version
        run: npm version ${{ steps.next.outputs.next-version }} --no-git-tag-version
        working-directory: ui

      - name: Commit and push next development version
        run: |
          git add -A
          git commit -m "Next development version: ${{ steps.next.outputs.next-version }}"
          git push
