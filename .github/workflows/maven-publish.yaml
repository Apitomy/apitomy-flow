name: Maven Publish Workflow
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release version to publish (e.g., 1.0.0)'
        required: true
  workflow_call:
    inputs:
      release-version:
        description: 'Release version to publish'
        required: true
        type: string
      quiet:
        description: 'Leave the Slack notification to the caller'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  maven-publish:
    runs-on: ubuntu-latest
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    if: github.repository_owner == 'Apitomy'
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.release-version }}

      # Tags created before the Maven Wrapper was added lack engine/mvnw. Take the wrapper from the
      # workflow's own commit so older tags can still be (re-)published with the pinned Maven version.
      - name: Checkout Maven Wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .wrapper-source
          sparse-checkout: |
            engine/mvnw
            engine/.mvn
          sparse-checkout-cone-mode: false

      - name: Provide Maven Wrapper
        run: |
          if [ ! -x engine/mvnw ]; then
            cp .wrapper-source/engine/mvnw engine/mvnw
            mkdir -p engine/.mvn
            cp -r .wrapper-source/engine/.mvn/wrapper engine/.mvn/
          fi
          rm -rf .wrapper-source

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Pre-fetch the Maven distribution used by the wrapper, retrying transient download failures
      # (e.g. Maven Central hiccups) with exponential backoff: 5s, 10s, 20s, 40s between attempts.
      - name: Download Maven (with retry)
        uses: Apitomy/apitomy-github-actions/retry@e10e64b8a9ca86982f45a1ea512847219ae2605e # v1.0.1
        with:
          command: ./mvnw -B --version
          working-directory: engine
          max-attempts: 5
          initial-delay: 5


      - name: Log Metadata
        run: |
          echo "Publishing Apitomy Flow Engine version ${{ inputs.release-version }} to Maven Central"
          echo "Publishing from tag: v${{ inputs.release-version }}"


      - name: Set up settings.xml
        run: |
          echo "<settings><servers><server><id>central</id><username>${{ secrets.CENTRAL_USERNAME }}</username><password>${{ secrets.CENTRAL_TOKEN }}</password></server></servers><profiles><profile><id>central</id><activation><activeByDefault>true</activeByDefault></activation><properties><gpg.executable>gpg</gpg.executable></properties></profile></profiles></settings>" > /home/runner/.m2/settings.xml
          cat /home/runner/.m2/settings.xml


      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}


      - name: Build
        run: ./mvnw -B clean install -DskipTests
        working-directory: engine


      - name: Maven Deploy
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 45
          max_attempts: 5
          retry_wait_seconds: 120
          command: cd engine && ./mvnw deploy -Prelease --batch-mode --settings /home/runner/.m2/settings.xml -DskipTests

      # Slack, when run on its own: success to the general channel, failure to the
      # important one. release.yaml reports the publishes it calls itself.
      - name: Notify
        if: ${{ !cancelled() && !inputs.quiet }}
        uses: Apicurio/apicurio-github-actions/notify-slack@bd19cbe33797325a571cd7ffd58f639b62e128a2 # v2.4.0
        with:
          level: ${{ job.status == 'success' && 'general' || 'important' }}
          text: "${{ job.status == 'success' && format(':package: {0}: {1} published {2}', github.repository, github.workflow, inputs.release-version) || format(':x: {0}: {1} failed for {2}', github.repository, github.workflow, inputs.release-version) }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: ${{ job.status != 'success' && github.actor || '' }}
          machine-users: apitomy-ci
          user-map: ${{ secrets.SLACK_USER_MAP }}
          important-webhook: ${{ secrets.SLACK_IMPORTANT_NOTIFICATION_WEBHOOK }}
          general-webhook: ${{ secrets.SLACK_GENERAL_NOTIFICATION_WEBHOOK }}
