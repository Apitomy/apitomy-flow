name: Verify
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  build-and-test:
    name: Engine Build + Test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      # Pre-fetch the Maven distribution used by the wrapper, retrying transient download failures
      # (e.g. Maven Central hiccups) with exponential backoff: 5s, 10s, 20s, 40s between attempts.
      - name: Download Maven (with retry)
        working-directory: engine
        run: |
          for attempt in 1 2 3 4 5; do
            if ./mvnw -B --version; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((5 * 2 ** (attempt - 1)))
              echo "::warning::Maven download failed (attempt $attempt/5); retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Maven download failed after 5 attempts"
          exit 1

      - name: Build and test
        run: ./mvnw -B clean install
        working-directory: engine

  ui-build:
    name: UI Lint + Build + Test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Test
        run: npm test
        working-directory: ui
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui

  ui-browser:
    name: UI Browser + Packed Consumer
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui/browser/consumer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Install Chromium and OS dependencies
        # Headless runs only need Chromium's headless shell. Bound the step and make apt retry
        # with short timeouts, so an unresponsive Ubuntu mirror fails fast instead of hanging
        # until the job timeout.
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99ci-network > /dev/null
          npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 5
        working-directory: ui
      - name: Browser contracts and packed consumer
        run: npm run test:browser
        working-directory: ui
