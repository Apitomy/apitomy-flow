name: Verify
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  build-and-test:
    name: Engine Build + Test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test
        run: mvn clean install
        working-directory: engine

  ui-build:
    name: UI Lint + Build + Test
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Test
        run: npm test
        working-directory: ui
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui

  ui-browser:
    name: UI Browser + Packed Consumer
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Apitomy'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            ui/browser/consumer/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Browser contracts and packed consumer
        run: npm run test:browser
        working-directory: ui
